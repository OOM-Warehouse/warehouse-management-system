<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<div th:insert="~{fragments/header :: header}"></div>
<div th:insert="~{fragments/navbar :: navbar}"></div>

<div class="container-fluid px-4 py-3">
    <div th:if="${param.notFound}" class="alert alert-warning my-3">Shipment not found.</div>
    <div th:if="${param.invalid}" class="alert alert-danger my-3">That shipment action is not allowed.</div>
    <div th:if="${param.invalidFilter}" class="alert alert-warning my-3">Unknown filter value ignored.</div>

    <div class="d-flex justify-content-between align-items-center my-3">
        <h1 class="m-0">Shipments</h1>
        <div>
            <a class="btn btn-outline-dark me-2" href="/shipments/track"><i class="bi bi-search me-1"></i>Track</a>
            <a class="btn btn-dark" href="/shipments/new"><i class="bi bi-plus-lg me-1"></i>New shipment</a>
        </div>
    </div>

    <form th:action="@{/shipments}" method="get" class="row g-2 mb-3">
        <div class="col-auto">
            <select name="status" class="form-select">
                <option value="">All statuses</option>
                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s.label}"
                        th:selected="${s == selectedStatus}">Created</option>
            </select>
        </div>
        <div class="col-auto">
            <input type="number" name="salesOrderId" class="form-control" placeholder="Sales order #"
                   th:value="${salesOrderId}">
        </div>
        <div class="col-auto"><button class="btn btn-outline-secondary" type="submit">Filter</button></div>
    </form>

    <table class="table">
        <thead>
            <tr>
                <th scope="col">Tracking #</th>
                <th scope="col">Sales order</th>
                <th scope="col">Carrier</th>
                <th scope="col">Method</th>
                <th scope="col">Status</th>
                <th scope="col">Expected</th>
                <th scope="col">Created</th>
                <th scope="col"></th>
            </tr>
        </thead>
        <tbody>
            <tr th:if="${page.isEmpty()}">
                <td colspan="8" class="text-muted text-center py-3">No shipments found.</td>
            </tr>
            <tr th:each="s : ${page.content}">
                <td th:text="${s.trackingNumber}">TRK-ABC</td>
                <td><a th:href="@{/sales-orders/{id}(id=${s.salesOrder.id})}" th:text="${s.salesOrder.id}">1</a></td>
                <td th:text="${s.carrier}">DHL</td>
                <td th:text="${s.shippingMethod}">STANDARD</td>
                <td><span class="badge bg-secondary" th:text="${s.status.label}">Created</span></td>
                <td th:text="${s.expectedDeliveryDate != null} ? ${#temporals.format(s.expectedDeliveryDate, 'MMM dd, yyyy')} : '—'">—</td>
                <td th:text="${#temporals.format(s.createdAt, 'MMM dd, yyyy HH:mm')}">May 14, 2026</td>
                <td><a class="btn btn-sm btn-outline-dark" th:href="@{/shipments/{id}(id=${s.id})}">View</a></td>
            </tr>
        </tbody>
    </table>
    <nav th:if="${page != null and page.totalPages > 1}" class="d-flex justify-content-between align-items-center mt-3">
        <div class="text-muted small">
            Page <span th:text="${page.number + 1}">1</span> of <span th:text="${page.totalPages}">1</span>
            — <span th:text="${page.totalElements}">0</span> total
        </div>
        <ul class="pagination mb-0">
            <li class="page-item" th:classappend="${page.first} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/shipments(page=${page.number - 1}, size=${page.size}, status=${selectedStatus}, salesOrderId=${salesOrderId})}">&laquo;</a>
            </li>
            <li class="page-item" th:classappend="${page.last} ? 'disabled' : ''">
                <a class="page-link" th:href="@{/shipments(page=${page.number + 1}, size=${page.size}, status=${selectedStatus}, salesOrderId=${salesOrderId})}">&raquo;</a>
            </li>
        </ul>
    </nav>
</div>

<div th:insert="~{fragments/footer :: footer}"></div>
</html>
